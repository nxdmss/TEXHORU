name: texhoru
services:
  app:
    image: texhoru:${TEXHORU_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ${TEXHORU_ENV_FILE:-/etc/texhoru/app.env}
        format: raw
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: file:/data/texhoru.db
      SERVE_STOREFRONT: 'true'
      FRONTEND_ORIGIN: https://${TEXHORU_DOMAIN:?Set TEXHORU_DOMAIN}
      FRONTEND_PUBLIC_URL: https://${TEXHORU_DOMAIN}
      TRUST_PROXY_HOPS: '1'
      MEDIA_STORAGE_DRIVER: local
      ALLOW_PERSISTENT_LOCAL_MEDIA: 'true'
      TEXHORU_UPLOADS_DIR: /uploads
      TEXHORU_ENV_FILE: /nonexistent
      SQLITE_WAL_ENABLED: 'true'
      MONITOR_RECHECK_CONCURRENCY: '2'
      MONITOR_SCHEDULE_AUTHORIZED_ONLY: 'true'
      DATA_RETENTION_ENABLED: 'true'
      DATA_RETENTION_DAYS: '30'
      ALLOW_DEV_PAYMENT: 'false'
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - ${TEXHORU_DATA_DIR:-/var/lib/texhoru}/database:/data
      - ${TEXHORU_DATA_DIR:-/var/lib/texhoru}/uploads:/uploads
    # Only Caddy is reachable from the internet. No host port for API/database.
    expose: ['3000']
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    shm_size: 256mb
    mem_limit: 2560m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      TEXHORU_DOMAIN: ${TEXHORU_DOMAIN}
      NO_PROXY: app,localhost,127.0.0.1
      no_proxy: app,localhost,127.0.0.1
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TEXHORU_DATA_DIR:-/var/lib/texhoru}/caddy/data:/data
      - ${TEXHORU_DATA_DIR:-/var/lib/texhoru}/caddy/config:/config
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
