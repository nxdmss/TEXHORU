name: TEXHORU CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest now selects 26.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix server ci
      - run: node -e "require('node:fs').copyFileSync('server/.env.example','server/.env.local')"
      - run: npm --prefix server run prisma:local:generate
        env:
          DATABASE_URL: file:./dev-local.db
      - run: npm --prefix server run prisma:local:push
        env:
          DATABASE_URL: file:./dev-local.db
      - name: Проверить сценарии агента Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @(
            'onec/agent/Install-TEXHORUAgent.ps1',
            'onec/agent/Run-TEXHORUAgent.ps1',
            'onec/agent/Remove-TEXHORUAgent.ps1',
            'onec/agent/Agent-Protocol.ps1',
            'onec/agent/Update-TEXHORUAgent.ps1',
            'onec/agent/Set-TEXHORUCloudEndpoint.ps1',
            'onec/catalog-agent/Install-CatalogAgent.ps1',
            'onec/catalog-agent/Update-CatalogAgent.ps1',
            'onec/catalog-agent/Run-CatalogAgent.ps1',
            'onec/catalog-agent/Read-UT103.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "Ошибка синтаксиса PowerShell: $script"
            }
          }
      - name: Проверить пакеты COM-агента каталога
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/catalog-agent.test.ps1
      - name: Проверить протокол результата агента
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/agent-protocol.test.ps1
      - name: Проверить переключение TEST-агента на облако
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/agent-cloud-endpoint.test.ps1
      - run: node --test tests/catalog-groups.test.mjs tests/demo-launcher.test.mjs tests/cloud-transfer.test.mjs tests/cloud-catalog-transfer.test.mjs
      - run: npm run test:project
      - run: npm run build:all
      - run: npm --prefix server run test:monitor
      - run: node --test server/tests/account-catalog-sync.test.cjs server/tests/remote-catalog.test.cjs
      - name: Install browser for interface checks
        if: runner.os == 'Linux'
        run: node server/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Check storefront and admin in the browser
        if: runner.os == 'Linux'
        run: |
          node tests/storefront.browser.mjs
          node tests/accounts.browser.cjs
          node tests/remote-catalog.browser.mjs
          node tests/price-demo.browser.mjs
