name: TEXHORU CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix server ci
      - run: node -e "require('node:fs').copyFileSync('server/.env.example','server/.env.local')"
      - run: npm --prefix server run prisma:local:generate
        env:
          DATABASE_URL: file:./dev-local.db
      - run: npm --prefix server run prisma:local:push
        env:
          DATABASE_URL: file:./dev-local.db
      - name: Проверить сценарии агента Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @(
            'onec/agent/Install-TEXHORUAgent.ps1',
            'onec/agent/Run-TEXHORUAgent.ps1',
            'onec/agent/Remove-TEXHORUAgent.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "Ошибка синтаксиса PowerShell: $script"
            }
          }
      - run: node --test tests/catalog-groups.test.mjs
      - run: npm run test:project
      - run: npm run build:all
      - run: npm --prefix server run test:monitor
